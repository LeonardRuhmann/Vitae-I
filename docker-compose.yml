services:
  postgres:
    image: postgres:17
    container_name: vitae-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitae_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vitae_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitae}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
